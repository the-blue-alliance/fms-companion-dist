name: tba-offseason-companion-release
services:
  app:
    image: "phillopreiato/tba-offseason-companion:latest"
    volumes:
      - db_storage:/app/db
      - type: bind
        source: "${TBA_COMPANION_BACKUP_DIR:-./db-backup}"
        target: /app/db-backup
    ports:
      - 6001:6001
    env_file:
      - ./backend/env/production

volumes:
  db_storage: